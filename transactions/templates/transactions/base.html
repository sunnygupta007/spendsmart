{% load static %} <!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>{% block title %}SpendSmart{% endblock %}</title>

    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <script>
      window.addEventListener('pageshow', function(event) {
          const isBackNavigation = window.performance && window.performance.getEntriesByType("navigation")[0].type === "back_forward";
          if (event.persisted || isBackNavigation) {
              // 1. Instantly make the entire page invisible
              document.body.style.opacity = '0'; 
              // 2. Force the server reload
              window.location.reload(true); 
          }
      });
    </script>
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg border-bottom shadow-sm">
      <div class="container">
        <a
          class="navbar-brand fw-bold text-primary"
          href="{% url 'transactions:dashboard' %}"
        >
          <i class="bi bi-wallet2 me-2"></i>SpendSmart
        </a>

        <div class="d-flex align-items-center">
          <button
            class="btn btn-link nav-link mx-2"
            id="themeToggler"
            type="button"
          >
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
          </button>

          <!-- <div id="nav-auth-section"></div> -->
          <div id="nav-auth-section" class="d-flex align-items-center"></div>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      {% if messages %} {% for message in messages %}
      <div
        class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm"
        role="alert"
      >
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %} {% endif %} {% block content %}{% endblock %}
    </div>

    <!-- <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      style="z-index: 1055"
    > -->
    <div class="toast-container position-fixed top-0 start-0 w-100 d-flex justify-content-center p-3 mt-2" style="z-index: 1055; pointer-events: none;">
      <div
        id="appToast"
        class="toast align-items-center text-white border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body fw-bold" id="toastMessage"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>

    <script>
      const themeToggler = document.getElementById("themeToggler");
      const themeIcon = document.getElementById("themeIcon");
      const htmlElement = document.documentElement;

      // Check if user has a saved preference, otherwise use system preference
      const savedTheme =
        localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");

      // Apply initial theme
      htmlElement.setAttribute("data-bs-theme", savedTheme);
      updateIcon(savedTheme);

      themeToggler.addEventListener("click", () => {
        const currentTheme = htmlElement.getAttribute("data-bs-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";

        htmlElement.setAttribute("data-bs-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        updateIcon(newTheme);
      });

      function updateIcon(theme) {
        if (theme === "dark") {
          themeIcon.classList.replace("bi-moon-stars-fill", "bi-sun-fill");
        } else {
          themeIcon.classList.replace("bi-sun-fill", "bi-moon-stars-fill");
        }
      }

      // 1. Check if the user is logged in
      document.addEventListener("DOMContentLoaded", async () => {
        const authSection = document.getElementById("nav-auth-section");

        try {
          // Call our new endpoint. The browser attaches the cookie automatically!
          const response = await fetch("/api/me/");

          if (response.ok) {
            const data = await response.json();
            // User is logged in! Show their name and a Logout button
            authSection.innerHTML = `
                        <span class="me-3 mb-0 d-none d-sm-inline">
                            Hello, <strong>${data.username}</strong>
                        </span>
                        <button onclick="handleLogout()" class="btn btn-sm btn-outline-danger">Logout</button>
                    `;
          } else {
            // User is NOT logged in. Show Login/Register buttons
            authSection.innerHTML = `
                        <a href="/users/login/" class="btn btn-sm btn-primary me-2">Login</a>
                        <a href="/users/register/" class="btn btn-sm btn-outline-primary">Register</a>
                    `;
          }
        } catch (error) {
          console.error("Auth check failed:", error);
        }
      });

      // 2. Handle the logout button securely
      async function handleLogout() {
        try {
          await fetch("/api/logout/", { method: "POST" });
          window.location.href = "/users/login/"; // Redirect to login page
        } catch (error) {
          console.error("Logout failed:", error);
        }
      }

      // 1. Function to show a toast immediately
      function showToast(message, type = "success") {
        const toastEl = document.getElementById("appToast");
        const toastBody = document.getElementById("toastMessage");

        // Set color based on success or error
        toastEl.className = `toast align-items-center text-white bg-${type} border-0`;
        toastBody.textContent = message;

        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
      }

      // 2. Check if a page redirected here with a saved message!
      document.addEventListener("DOMContentLoaded", () => {
        const pendingToast = sessionStorage.getItem("toastMessage");
        const pendingToastType = sessionStorage.getItem("toastType");

        if (pendingToast) {
          showToast(pendingToast, pendingToastType || "success");
          sessionStorage.removeItem("toastMessage");
          sessionStorage.removeItem("toastType");
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
