{% extends "transactions/base.html" %} {% block title %}Login - SpendSmart
{% endblock %} {% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5">
        <h3 class="text-center mb-4 text-primary fw-bold">
          Login to SpendSmart
        </h3>

        <form id="loginForm">
          <div
            id="errorBox"
            class="alert alert-danger d-none shadow-sm border-0 rounded-3"
          ></div>

          <div class="mb-3">
            <label class="form-label fw-bold text-secondary">Username</label>
            <input type="text" id="username" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold text-secondary">Password</label>
            <div class="input-group">
                <input type="password" id="password" class="form-control" required />
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    <i class="bi bi-eye" id="toggleIcon"></i>
                </button>
            </div>
          </div>

          <!-- <button class="btn btn-primary w-100 py-2 mt-3 fw-bold" type="submit">
            Log In
          </button> -->
          <button type="submit" class="btn btn-primary w-100 py-2 mt-3 fw-bold" id="loginBtn">
    <span class="button-text">Login</span>
    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true" id="loginSpinner"></span>
</button>
        </form>

        <div class="mt-4 text-center">
          <p class="text-muted mb-0">
            Don't have an account?
            <a
              href="{% url 'users:register' %}"
              class="text-decoration-none fw-bold"
              >Register here</a
            >.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Function to reset the Login Button
function resetLoginButton() {
    const loginBtn = document.getElementById('loginBtn');
    const loginSpinner = document.getElementById('loginSpinner');
    const buttonText = loginBtn.querySelector('.button-text');

    loginBtn.disabled = false;                  // Re-enable the button
    loginSpinner.classList.add('d-none');       // Hide the spinner
    buttonText.textContent = 'Login';           // Reset the text
}

  document.addEventListener("DOMContentLoaded", function() {
        const loginForm = document.querySelector('form'); // Make sure this targets your form
        const loginBtn = document.getElementById('loginBtn');
        const loginSpinner = document.getElementById('loginSpinner');
        const buttonText = loginBtn.querySelector('.button-text');

        loginForm.addEventListener('submit', function(event) {
            // Disable the button to prevent multiple clicks
            loginBtn.disabled = true;

            // Optional: Hide the text and just show the spinner
            // buttonText.classList.add('d-none'); 

            // Show the spinner
            loginSpinner.classList.remove('d-none');
            
            // Optional: Change button text
            buttonText.textContent = ' Logging in...';
        });
    });

  document
    .getElementById("loginForm")
    .addEventListener("submit", async function (e) {
      e.preventDefault(); // Stop the form from reloading the page

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("errorBox");

      try {
        // Hit our secure Django API
        const response = await fetch("/api/login/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        if (response.ok) {
          sessionStorage.setItem("toastMessage", "Welcome back!");
          window.location.href = "/";
        } else {
          errorBox.classList.remove("d-none");
          errorBox.innerText = "Invalid username or password.";
          resetLoginButton(); // <--- CALL THE RESET FUNCTION HERE
        }
      } catch (error) {
        console.error(error);
        errorBox.classList.remove("d-none");
        errorBox.innerText = "A network error occurred.";
        resetLoginButton(); // <--- CALL THE RESET FUNCTION HERE
      }
    });

    // --- ADD THIS NEW TOGGLE LOGIC ---
  document.getElementById("togglePassword").addEventListener("click", function () {
    const passwordInput = document.getElementById("password");
    const toggleIcon = document.getElementById("toggleIcon");

    if (passwordInput.type === "password") {
      passwordInput.type = "text";
      toggleIcon.classList.remove("bi-eye");
      toggleIcon.classList.add("bi-eye-slash");
    } else {
      passwordInput.type = "password";
      toggleIcon.classList.remove("bi-eye-slash");
      toggleIcon.classList.add("bi-eye");
    }
  });
</script>
{% endblock %}
